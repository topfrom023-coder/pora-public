<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Школьная пора</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0f18;--snow:#eef1f7;--dim:#aab3c8;--line:#3a4363;--acc:#a9c2f2;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--snow);font-family:'Noto Serif',Georgia,serif;overflow:hidden}
#g{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .6s}
#bg svg{width:100%;height:100%;display:block}
#cr{position:absolute;left:0;right:0;top:40%;height:30%;pointer-events:none;overflow:hidden}
.w{position:absolute;bottom:0;animation:walk linear infinite}
.w i{display:block;width:100%;height:100%;background-size:contain;background-repeat:no-repeat;animation:bob .7s ease-in-out infinite}
.q{position:absolute;bottom:0}.q i{display:block;width:100%;height:100%;background-size:contain;background-repeat:no-repeat;animation:nod 5s ease-in-out infinite}
@keyframes walk{from{left:-8%}to{left:108%}}
@keyframes bob{50%{transform:translateY(-3%)}}@keyframes nod{50%{transform:translateY(3%) rotate(2deg)}}
#snow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;
background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(3px 3px at 90px 80px,#fff,transparent),radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 60px 140px,#fff,transparent),radial-gradient(2.5px 2.5px at 130px 110px,#fff,transparent);
background-size:190px 170px;animation:fall 7s linear infinite}
.sn #snow{opacity:.85}
@keyframes fall{to{background-position:-40px 170px}}
#pic{position:absolute;left:50%;bottom:0;height:88%;max-width:60%;object-fit:contain;transform-origin:50% 100%;transform:translateX(-50%) var(--t,none);opacity:0;transition:opacity .3s,transform .35s;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
#pic.on{opacity:1}
#pic.shake{animation:shk .4s 2}#pic.hop{animation:hop .5s 2}
@keyframes shk{25%{margin-left:-8px}75%{margin-left:8px}}@keyframes hop{50%{margin-bottom:22px}}
#box{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(92%,860px);padding:12px 18px 14px;min-height:96px;background:rgba(10,12,22,.82);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
#nm{position:absolute;left:14px;top:-16px;padding:3px 12px;border-radius:8px;background:#10142a;border:1px solid var(--line);font-weight:700;font-size:15px}
#nm:empty{display:none}
#ps{font-style:italic;color:var(--dim);font-size:14px;margin:4px 0 2px}
#tx{font-size:17px;line-height:1.5;min-height:50px}
#hint{position:absolute;right:14px;bottom:6px;color:var(--dim);font-size:13px}
#ch{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(92%,640px);display:flex;flex-direction:column;gap:7px}
button{font:inherit;color:var(--snow);background:rgba(18,22,42,.92);border:1px solid var(--line);border-radius:10px;padding:11px 14px;text-align:left;font-size:16px;line-height:1.3;cursor:pointer}
button:active,button:focus-visible{background:#26335f;border-color:var(--acc);outline:none}
#mu{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));width:44px;height:40px;padding:0;text-align:center;font-size:20px;z-index:4}
#st,#rot{position:absolute;inset:0;z-index:6;background:linear-gradient(#10152a,#05060b);display:none;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:20px;text-align:center}
#st.on{display:flex}#st>*{width:min(100%,420px)}
#rot{z-index:9;font-size:20px;line-height:1.5}
@media(orientation:portrait){#rot{display:flex}}
h1{font-size:38px;line-height:1.1;margin:0;font-weight:700}
p.s{color:var(--dim);margin:0;line-height:1.45;font-size:15px}
input{font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0d1122;color:var(--snow);text-align:center}
input:focus{outline:2px solid var(--acc)}
.pri{background:var(--acc);color:#0b1020;font-weight:700;text-align:center;border:0}
</style></head><body>
<div id="g"><div id="bg"></div><div id="cr"></div><div id="snow"></div>
<img id="pic" alt="">
<button id="mu" aria-label="Музыка">♪</button>
<div id="ch"></div>
<div id="box"><div id="nm"></div><div id="ps"></div><div id="tx"></div><span id="hint">▾</span></div>
<div id="st" class="on"><h1>Школьная пора</h1>
<p class="s">Визуальная новелла. Нажимай на экран, чтобы читать дальше. От ответов зависит концовка. Лучше в наушниках и в горизонтальном режиме.</p>
<input id="nin" maxlength="14" placeholder="Как тебя зовут?" autocomplete="off">
<button class="pri" id="go">Начать</button><button id="cont" style="display:none">Продолжить</button></div>
<div id="rot"><div style="font-size:54px">⟳</div>Поверни телефон горизонтально</div></div>

 болтай много.", {"g": "r1e"}, {"l": "r1e"}, "L|Он добрее, чем кажется. Просто потерял кого-то. Но это не мой секрет.", {"b": "class"}, "T|Тихо, садимся! У нас новый ученик, {n}. Место свободно рядом с Кагэямой.", "R0|lf|...Только ручку не проси. Ладно, держи запасную.", {"c": [["Взять ручку и сказать спасибо.", "pen", 1], ["Отказаться, у меня своя.", "pen"]]}, {"l": "pen"}, "N|Урок тянется медленно. Рэн смотрит в окно так, будто ждёт кого-то в снегу, хотя за стеклом сакура.", {"b": "club"}, "N|После уроков Лея приводит тебя в старую комнату литературного клуба.", "A|sa|Новенький? Я Ари Сиранэ. Не шуми, я восстанавливаю удалённые записи с камер.", "K|Не слушай её, она всех так встречает. Я Кай Мори, президент совета. Хорошо, что ты пришёл: нам нужна помощь.", "K|cl|Пропал ключ от закрытого кабинета театрального клуба. А вчера под дверью нашли записку.", "A|Читаю: «Приходи в полночь, когда пойдёт снег. Я всё ещё жду».", "L|sh|Этот почерк... Нет, не может быть.", {"c": [["Кто-то шутит?", "c2a"], ["Нужно осмотреть кабинет.", "c2b", 0, 1]]}, {"l": "c2a"}, "K|Хотелось бы. Но записка лежала с внутренней стороны запертой двери.", {"g": "c2e"}, {"l": "c2b"}, "K|Верно. Только дверь заперта, а ключа нет.", {"g": "c2e"}, {"l": "c2e"}, "A|Дай мне время до вечера, проверю камеры коридора.", "K|А ты, {n}, пока поговори с ребятами. Узнай, что они помнят.", {"l": "hub1"}, {"c": [["Поговорить с Леей", "tL", 0, 0, "tL"], ["Поговорить с Каем", "tK", 0, 0, "tK"], ["Поговорить с Ари", "tA", 0, 0, "tA"], ["Подняться на крышу", "roof"]]}, {"l": "tL"}, "L|tl|Я стараюсь, чтобы в школе всем было спокойно. Но в последнее время мне снится снег.", "L|sa|Как будто кто-то зовёт меня по имени. Тебе тоже иногда так кажется?", {"c": [["Да, иногда.", "hub1", 0, 1], ["Нет, это просто усталость.", "hub1"]]}, {"l": "tK"}, "K|lf|Совет — это не про власть, а про ответственность. Если что-то случится со школой, спрошу с себя.", "K|jp|Но ты можешь присесть и выпить чаю. Это тоже часть расследования.", {"g": "hub1"}, {"l": "tA"}, "A|tl|Камеры у нас древние. Но кое-что я нашла: каждый год в одну и ту же ночь сбой записи.", "A|sh|Всегда в 23:40. Как по расписанию. Жуть.", {"c": [["Значит, это не случайность.", "hub1", 0, 1], ["Может, просто проводка?", "hub1"]]}, {"l": "roof"}, {"b": "roof"}, "N|На крыше дует ветер. Рэн стоит у ограды, прижав ладонь к затылку.", "R1|tr|Опять ты. Меня что, назначили твоим гидом?", "Я|Кай сказал, что ты многое видел.", "R1|Кай много чего говорит.", "R1|sa|...Записку я тоже видел. Её оставили для меня.", {"c": [["Для тебя? Почему?", "r2a", 1], ["Расскажи, я помогу.", "r2b", 2, 1], ["Это не моё дело.", "r2c", -1]]}, {"l": "r2a"}, "R1|cl|Потому что это его почерк. Юки. Мой старший брат.", {"g": "r2e"}, {"l": "r2b"}, "R1|Не обещай, если не уверен. Но ладно. Это почерк Юки, моего брата.", {"g": "r2e"}, {"l": "r2c"}, "R1|ab|Разумно. Только это почерк моего брата Юки, и я отсюда не уйду.", {"g": "r2e"}, {"l": "r2e"}, "R1|sa|Пять лет назад он пропал в такую же снежную ночь. После репетиции театрального клуба.", "R1|Если правда хочешь помочь, не лги мне. Это всё, о чём я прошу.", {"b": "wc"}, "N|Ты заходишь в школьный туалет умыться. Из-за дверцы кабинки доносится шёпот.", "S|Ключ у меня, а они всё ищут... Ох.", "N|Дверь скрипит. Из кабинки выходит парень с белыми волосами и красными глазами.", "S|jp|Ты тоже новенький? Я Сора Асахина. Не подслушивай, это невежливо. Хотя здесь отличная акустика.", {"c": [["Ты что-то знаешь о ключе?", "s1a", 0, 1], ["Давай просто подружимся.", "s1b"]]}, {"l": "s1a"}, "S|tl|Ключ? Какой ключ?.. Шучу. Я слышал разговоры. Я не вор.", {"g": "s1e"}, {"l": "s1b"}, "S|Подружимся? Мне нравится твоя прямота. Попробуем.", {"g": "s1e"}, {"l": "s1e"}, "S|Совет: в полночь лучше не быть одному. Особенно здесь.", "N|Он улыбается, но глаза остаются холодными.", {"b": "yard"}, "N|На большой перемене двор полон народа: кто-то играет в мяч, кто-то ест на лавочках.", {"l": "hub2"}, {"c": [["Найти Рэна на лавочке", "tR", 0, 0, "tR"], ["Поговорить с Сорой", "tS", 0, 0, "tS"], ["Пойти домой", "home"]]}, {"l": "tR"}, "R2|lf|Чего ты хочешь?.. Ладно, садись.", "R2|sa|Юки любил кормить уличных кошек за школой. Говорил, что они не умеют лгать.", {"c": [["Пойдём вместе покормим.", "hub2", 2], ["Расскажи про брата.", "hub2", 1, 1]]}, {"l": "tS"}, "S|Люблю снег. В нём всё честнее: следы не врут.", "S|tl|Ты оставляешь следы, {n}. Интересно, куда они ведут?", {"g": "hub2"}, {"l": "home"}, {"b": "street"}, "N|Вечером ты идёшь домой по той же улице. Фонари зажигаются один за другим.", {"b": "home1"}, "M|Ты вернулся? Ужин на столе. Как первый день?", {"c": [["Странно, но интересно.", "h1", 0, 1], ["Устал, всё нормально.", "h1"]]}, {"l": "h1"}, "N|В своей комнате ты выкладываешь записки на стол и пытаешься сложить всё в одну картинку.", "N|Телефон вибрирует. Сообщение от Ари: «Нашла запись. Утром покажу. Рэн просил передать: заходи к нему вечером».", {"b": "home2"}, "N|Дом Рэна старый и тихий. Пахнет чаем и бумагой. На полке стоит фото двух мальчишек.", "R0|lf|Заходи. Обувь у порога. ...Это Юки. Его комната, он ничего не трогал.", "R2|sa|Пять лет я сижу тут и жду. Если честно, ты первый, кому я это показал.", {"c": [["Я не оставлю тебя одного.", "r3a", 2], ["Я хочу узнать правду.", "r3b", 1], ["Мне нужно знать, что ты не врёшь.", "r3c", -1]]}, {"l": "r3a"}, "R2|cl|...Спасибо. Только не жалуйся, если станет страшно.", {"g": "r3e"}, {"l": "r3b"}, "R2|Правду. Да. Её я ждал все пять лет.", {"g": "r3e"}, {"l": "r3c"}, "R2|tr|Я не вру. Но сомневаться тоже честно.", {"g": "r3e"}, {"l": "r3e"}, "R0|Юки носил повязку на лбу. Говорил, что она приносит удачу в спектаклях.", "R0|tl|Может, это он. А может, кто-то хочет, чтобы я так думал. Идём к школе.", {"b": "night"}, "N|У школьных ворот вас ждут Лея, Кай и Ари. Первые снежинки падают на плечи.", "K|Тихо. Слишком тихо. Идём вместе.", {"b": "snow"}, "N|Полночь. Густой снег. Вы идёте через пустой двор к театральному корпусу.", "Y|Стоять.", "N|Из метели выходит парень с повязкой на лбу. В вытянутой руке револьвер, нацеленный прямо на тебя.", "R0|sh|Юки?! Брат...", "Y|cl|Не бойтесь. Это реквизит из «Последнего выстрела». Мы так и не доиграли финал.", "Y|Пять лет я репетирую его один. Мне нужен ключ от сцены. И зрители.", "S|Ключ у меня. Я хотел, чтобы вы пришли сами.", "K|sh|Ты что, всё знал?", "S|Я слышу тех, кто ждёт. Только и всего.", {"c": [["Мы будем твоими зрителями.", "fin", 1, 1], ["Опусти оружие, пожалуйста.", "fin", 0, 1], ["Рэн, скажи что-нибудь брату.", "fin", 2]]}, {"l": "fin"}, {"j": "ren>=6&&clue>=2", "k": "endA"}, {"j": "ren>=3", "k": "endB"}, {"g": "endC"}, {"l": "endA"}, "N|Снег замирает в воздухе, будто кто-то нажал паузу.", "Y|Спасибо, что пришли. Финал всегда был про это: чтобы кто-то досмотрел до конца.", "R0|jp|Юки... Я скучал. Все эти годы.", "Y|Знаю. Береги себя, братишка. И его береги: он настоящий друг.", "N|Юки кланяется, как актёр после спектакля, и растворяется в снегу. Метель стихает.", "R0|{n}... Спасибо. Завтра на подоконнике я оставлю тебе место.", {"end": "Хорошая концовка: «Последний спектакль»"}, {"l": "endB"}, "N|Юки опускает револьвер и кладёт его на снег. Это всего лишь реквизит.", "Y|sa|Может, финал не нужно доигрывать в одиночку.", "N|Он исчезает, а снег всё идёт. Рэн долго молчит.", "R0|Пойдём домой. Завтра расскажу остальное.", {"end": "Тихая концовка: «Недосказанное»"}, {"l": "endC"}, "N|Юки растворяется в метели, не сказав ни слова. Рэн уходит первым, не оглядываясь.", "K|Нам нужно время. Ему особенно.", "S|Следы не врут. Они ещё вернутся.", {"end": "Грустная концовка: «Следы на снегу»"}];

function crowd(b){const c=$('cr');c.innerHTML='';const [n,k]=CROWD[b]||[0];if(!n)return;
  for(let j=0;j<n;j++){const d=document.createElement('div'),s=k==='w'?{h:60+Math.random()*35}:{h:70};
    d.className=k;const hh=s.h;d.style.height=hh+'%';d.style.width=hh*.4+'%';d.style.aspectRatio='3/8';d.style.width='auto';
    if(k==='w'){d.style.animationDuration=(30+Math.random()*30)+'s';d.style.animationDelay=-Math.random()*50+'s';d.style.bottom=Math.random()*12+'%';d.style.opacity=.85}
    else{d.style.left=(8+j*15)+'%';d.style.bottom=(j%2)*10+'%'}
    const i=document.createElement('i');i.style.backgroundImage=fig(pick(['#f3d3b8','#e8c4a4','#f6dcc6']),pick(['#2b2420','#4a3426','#1f2530','#6a4a2c']),pick(['#2c3a5c','#3a3f55','#5a3a4a','#2f4a45']),pick(['#23273a','#2a2f40']));
    if(k==='w')i.style.animationDelay=-Math.random()+'s';
    d.appendChild(i);c.appendChild(d)}}
function setBg(b){bg=b;$('bg').innerHTML=`<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice">${SC[b]()}</svg>`;$('g').className=(b==='night'||b==='snow')?'sn':'';crowd(b);bgm(b)}
/* music: calm generative pads + plucks */
let ac,bus,mg,mon=true,step=0,nx=0,tm;
const CH=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,66]],fq=m=>440*2**((m-69)/12);
function bgm(b){}
function startMusic(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.55;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;bus=ac.createGain();const dl=ac.createDelay();dl.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.45;
  bus.connect(lp);bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(lp);lp.connect(mg);mg.connect(ac.destination);nx=ac.currentTime+.1;
  const pad=(t,ch,len)=>ch.forEach(m=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=fq(m-12);o.detune.value=(Math.random()-.5)*10;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+len*.4);g.gain.linearRampToValueAtTime(0,t+len);o.connect(g);g.connect(bus);o.start(t);o.stop(t+len+.1)});
  const pl=(t,m)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=fq(m);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(g);g.connect(bus);o.start(t);o.stop(t+1.9)};
  tm=setInterval(()=>{while(nx<ac.currentTime+.9){const ch=CH[(step/8|0)%4];if(step%8===0)pad(nx,ch,4.8);if(step%2===0||Math.random()<.25)pl(nx,ch[Math.random()*4|0]+(Math.random()<.5?12:24));nx+=.6;step++}},250)}catch(e){}}
$('mu').onclick=()=>{mon=!mon;if(mg)mg.gain.value=mon?.55:0;$('mu').textContent=mon?'♪':'×'};
/* engine */
const lab={};STORY.forEach((s,k)=>{if(s.l)lab[s.l]=k});
let i=0,ren=0,clue=0,done=[],bg='street',who='',nick='Гость',wait=false,over=false;
function sv(n){try{localStorage.setItem('vn2',JSON.stringify({i:n,ren,clue,done,bg,who,nick}))}catch(e){}}
function ld(){try{return JSON.parse(localStorage.getItem('vn2'))}catch(e){return null}}
function portrait(k,p='n'){const e=$('pic');if(!k){e.classList.remove('on');who='';return}
  if(who!==k){e.src=PIC[k];who=k}e.classList.add('on');e.classList.remove('shake','hop');const d=PO[p]||PO.n;e.style.setProperty('--t',d[1]);void e.offsetWidth;if(d[2])e.classList.add(d[2])}
function say(line){
  const a=line.split('|'),w=a[0],t=a[a.length-1],p=a.length>2?a[1]:'n';
  $('ch').innerHTML='';$('hint').style.display='block';$('ps').textContent='';
  if(w==='Я'){$('nm').textContent=nick;$('nm').style.color='#a9c2f2'}
  else{const c=WHO[w[0]];$('nm').textContent=c[0];$('nm').style.color=c[1];
    if(w==='N'||w==='T'||w==='M')portrait('');else{portrait(w,p);const d=PO[p];if(d&&d[0])$('ps').textContent='— '+c[0].split(' ')[0]+' '+d[0]+' —'}}
  $('tx').textContent=t.replace(/\{n\}/g,nick);wait=true;sv(i)}
function choose(c){sv(i-1);wait=false;$('hint').style.display='none';$('nm').textContent='';$('ps').textContent='';$('tx').textContent='';
  c.forEach(o=>{if(o[4]&&done.includes(o[4]))return;const b=document.createElement('button');b.textContent=o[0];
    b.onclick=()=>{ren+=o[2]|0;clue+=o[3]|0;if(o[4])done.push(o[4]);i=lab[o[1]];$('ch').innerHTML='';run()};$('ch').appendChild(b)});
  $('box').style.visibility='hidden'}
function finish(t){over=true;wait=false;portrait('');$('hint').style.display='none';$('nm').textContent='Конец';$('nm').style.color='#a9c2f2';$('tx').textContent=t;
  const b=document.createElement('button');b.className='pri';b.textContent='Начать заново';b.onclick=()=>{try{localStorage.removeItem('vn2')}catch(e){}location.reload()};$('ch').appendChild(b)}
function run(){$('box').style.visibility='visible';
  for(;;){const s=STORY[i++];if(s===undefined)return;
    if(typeof s==='string'){say(s);return}
    if(s.b){setBg(s.b);continue}
    if(s.l)continue;if(s.g){i=lab[s.g];continue}
    if(s.j){if(new Function('ren','clue','return '+s.j)(ren,clue))i=lab[s.k];continue}
    if(s.c){choose(s.c);return}
    if(s.end){finish(s.end);return}}}
$('g').addEventListener('click',e=>{if(wait&&!over&&e.target.tagName!=='BUTTON'&&!$('st').classList.contains('on'))run()});
function begin(sd){startMusic();try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d).then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
  if(sd){({ren,clue,done,nick}=sd);i=sd.i;setBg(sd.bg)}else setBg('street');$('st').classList.remove('on');run()}
$('go').onclick=()=>{nick=$('nin').value.trim()||'Гость';begin(null)};
const sd=ld();if(sd){$('cont').style.display='block';$('cont').onclick=()=>begin(sd)}
setBg('school');
