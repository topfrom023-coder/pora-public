name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mkdir www && cp shkolnaya-pora.html www/index.html
          echo '{"name":"pora","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.0","@capacitor/core":"^6.1.0"},"devDependencies":{"@capacitor/cli":"^6.1.0"}}' > package.json
          echo '{"appId":"com.pora.game","appName":"Школьная пора","webDir":"www"}' > capacitor.config.json
          npm install
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pora-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
